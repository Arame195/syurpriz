<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Тебе письмо</title>
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090a1c;
            --gold1: #ffe0a0;
            --gold2: #f0b258;
            --ink: #3b2f55;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: #fff;
            font-family: 'Marck Script', cursive;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: none
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%
        }

        .abs {
            left: 0;
            right: 0;
            text-align: center;
            transition: opacity 1s
        }

        .hide {
            opacity: 0;
            pointer-events: none;
            opacity: 0 !important;
            animation: none !important;
        }

        #title {
            top: 14%;
            font-size: 26px;
            opacity: .85
        }

        #env {
            position: fixed;
            left: 50%;
            top: 44%;
            width: min(72vw, 320px);
            aspect-ratio: 3/2;
            transform: translate(-50%, -50%);
            perspective: 900px;
            cursor: pointer;
            transition: opacity 1s, transform 1.2s;
            animation: float 4s ease-in-out infinite
        }

        @keyframes float {
            50% {
                margin-top: -8px
            }
        }

        #env div {
            position: absolute;
            inset: 0
        }

        .eb {
            background: linear-gradient(160deg, #f4efe9, #cfc6d6);
            border-radius: 8px;
            box-shadow: 0 20px 60px #0008, 0 0 80px #b79cff33
        }

        .ef {
            background: linear-gradient(160deg, #fbf7f2, #d9d0de);
            clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
            border-radius: 8px
        }

        .fl {
            background: linear-gradient(#f7f2ec, #d6cbdc);
            clip-path: polygon(0 0, 100% 0, 50% 58%);
            transform-origin: top;
            transition: transform 1s;
            backface-visibility: hidden;
            z-index: 3
        }

        #env.open .fl {
            transform: rotateX(180deg);
            z-index: 0
        }

        .nm {
            display: flex !important;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 12%;
            color: var(--ink);
            font-size: 28px;
            z-index: 4
        }

        .seal {
            position: absolute !important;
            inset: auto !important;
            left: 50%;
            top: 50%;
            width: 34px;
            height: 34px;
            margin: -14px 0 0 -17px;
            border-radius: 50%;
            background: radial-gradient(#b48cf5, #6a3fb5);
            z-index: 5;
            box-shadow: 0 2px 8px #0006;
            transition: opacity .5s
        }

        #env.open .seal {
            opacity: 0
        }

        #env.gone {
            opacity: 0;
            transform: translate(-50%, -30%) scale(.8);
            pointer-events: none
        }

        #hint {
            top: 63%;
            font-size: 20px;
            opacity: .7;
            animation: pulse 2s infinite
        }

        @keyframes pulse {
            50% {
                opacity: .25
            }
        }

        #letter {
            position: fixed;
            left: 50%;
            top: 46%;
            width: min(106vw, 400px);
            height: min(86vh, 600px);
            box-sizing: border-box;
            padding: 6% 7%;
            background: linear-gradient(170deg, #fffdf9, #ece5f2);
            color: var(--ink);
            border-radius: 6px;
            box-shadow: 0 20px 70px #000a;
            opacity: 0;
            transform: translate(-50%, -50%) translateY(14vh) scale(.5);
            transition: opacity .8s, transform 1.4s cubic-bezier(.2, .8, .2, 1);
            font-size: clamp(17px, 4.6vw, 21px);
            line-height: 1.35;
            overflow: hidden;
            pointer-events: none
        }

        #letter.rise {
            opacity: 1;
            transform: translate(-50%, -50%) translateY(-6vh) scale(.5)
        }

        #letter.full {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1)
        }

        #letter.out {
            opacity: 0;
            transform: translate(-50%, -50%) scale(1.05) translateY(-4vh)
        }

        #txt {
            white-space: pre-wrap
        }

        #txt i {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--ink);
            vertical-align: -2px;
            animation: pulse 1s infinite
        }

        .btn {
            position: fixed;
            left: 50%;
            bottom: calc(-1% + env(safe-area-inset-bottom, -35px));
            transform: translateX(-50%);
            padding: 16px 44px;
            border: 0;
            border-radius: 30px;
            font: inherit;
            font-size: 24px;
            color: #4a3410;
            background: linear-gradient(var(--gold1), var(--gold2));
            box-shadow: 0 8px 30px #f0b25855;
            transition: opacity 1s;
            cursor: pointer
        }

        #final {
            position: relative;
            bottom: -60%;
            font-size: 38px;
            text-shadow: 0 0 20px #ff6b9d
        }

        #final small {
            display: block;
            font-size: 19px;
            opacity: .8;
            margin-top: 6px
        }

        #pick {
            position: fixed;
            top: 8px;
            right: 12px;
            font: 12px sans-serif;
            opacity: .4;
            z-index: 9
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <div id="title" class="abs">Принцесса,это тебе)</div>
    <div id="env">
        <div class="eb"></div>
        <div class="fl"></div>
        <div class="ef"></div>
        <div class="nm" id="nm"></div>
        <div class="seal"></div>
    </div>
    <div id="hint" class="abs">нажми на конверт</div>
    <div id="letter">
        <div id="txt"></div>
    </div>
    <button id="b1" class="btn hide">нажми ♡</button>
    <div id="g" class="abs hide" style="bottom:calc(19% + 20px);font-size:20px;opacity:.7">покрути галактику</div>
    <button id="b2" class="btn hide">Нажми!</button>

    ︎︎:
    <div id="final" class="abs hide"></div>
    <label id="pick"><input type="file" accept="IMG_2455.JPG" id="file" hidden></label>
    <script>
        /* ===== НАСТРОЙКИ: меняй здесь ===== */
        const CFG = {
            name: 'Сайрина',
            colorHearts: true, // true = сердечки в цветах фото, false = розовые по яркости
            photo: 'IMG_2455.JPG', // фото лежит рядом с index.html; если файла нет — рисуется силуэт-заглушка
            letter: ['Принцесса, я хочу тебе кое что сказать, я решил чуть порадовать тебя).', 'Ты одно из самых лучших и важный событие, которое произошло в моей жизни. Ты пришла и научила меня почаще улыбаться, быть сильным и более серьезно относиться к работе. Ты показала, что я тоже могу считать себя важным где-нибудь 😁.', 'Ну да. Косячу часто😂, но ты не смотря не на что всегда прощаешь ошибки своего дурачка). Иногда из-за ревности сделаю что-то не правильно, но я хочу, чтобы ты знала…', 'Ты подарила мне мир и стала для меня очень важным человеком. Тебя я терять не хочу😁🫶🏼.', 'Спасибо, что ты есть.☺️🫶🏼'],
            finalText: 'Видишь, даже 20.979 сердечки не смогли передать всю твою красоту🥹'
        };
        /* ================================== */
        const $ = s => document.querySelector(s), cv = $('#c'), ctx = cv.getContext('2d');
        let W, H, DPR, stage = 'start', ph = 0, spin = 0, tStart = 0, N = 0, P = null, photoImg = null;
        $('#nm').textContent = CFG.name;
        const COLS = 28, ROWS = 37;
        const GR = 4.5;
        function sprite(col) { const s = document.createElement('canvas'); s.width = s.height = 32; const x = s.getContext('2d'); x.fillStyle = col; x.beginPath(); x.moveTo(16, 29); x.bezierCurveTo(-6, 14, 6, -4, 16, 8); x.bezierCurveTo(26, -4, 38, 14, 16, 29); x.fill(); return s }
        const faceSp = [...Array(16)].map((_, i) => { const k = i / 15; return sprite(`rgb(${Math.round(150 + 105 * k)},${Math.round(30 + 200 * k * k)},${Math.round(80 + 150 * k * k)})`) });
        const galSp = [...Array(16)].map((_, i) => { const k = i / 15; return sprite(`rgb(${Math.round(255 - 90 * k)},${Math.round(210 - 60 * k)},${Math.round(255 - 10 * k)})`) });
        const colSp = []; const cs = k => colSp[k] || (colSp[k] = sprite(`rgb(${((k >> 6) & 7) * 32 + 16},${((k >> 3) & 7) * 32 + 16},${(k & 7) * 32 + 16})`));
        const stars = [...Array(110)].map(() => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + .3, p: Math.random() * 6 }));
        function placeholder() {
            const c = document.createElement('canvas'); c.width = 300; c.height = 400; const x = c.getContext('2d');
            x.fillStyle = '#000'; x.fillRect(0, 0, 300, 400);
            x.fillStyle = '#bbb'; x.beginPath(); x.ellipse(150, 420, 150, 110, 0, 0, 7); x.fill();
            x.fillStyle = '#ddd'; x.fillRect(125, 260, 50, 80);
            x.fillStyle = '#777'; x.beginPath(); x.ellipse(150, 150, 100, 125, 0, 0, 7); x.fill();
            const g = x.createRadialGradient(140, 160, 10, 150, 170, 110); g.addColorStop(0, '#fff'); g.addColorStop(1, '#bbb');
            x.fillStyle = g; x.beginPath(); x.ellipse(150, 185, 76, 98, 0, 0, 7); x.fill();
            x.fillStyle = '#222';[[118, 170], [182, 170]].forEach(e => { x.beginPath(); x.ellipse(e[0], e[1], 11, 6, 0, 0, 7); x.fill() });
            x.fillRect(138, 200, 24, 4); x.strokeStyle = '#333'; x.lineWidth = 5; x.beginPath(); x.arc(150, 222, 22, .2, 2.9); x.stroke();
            return c
        }
        function loadPhoto(src) { const im = new Image(); im.onload = () => { photoImg = im; build() }; im.onerror = () => { photoImg = placeholder(); build() }; im.src = src }
        function build() {
            W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2); cv.width = W * DPR; cv.height = H * DPR;
            const s = document.createElement('canvas'); s.width = Math.round(COLS * GR); s.height = Math.round(ROWS * GR); const x = s.getContext('2d');
            const iw = photoImg.width, ih = photoImg.height, tr = COLS / ROWS; let sw = iw, sh = iw / tr; if (sh > ih) { sh = ih; sw = ih * tr }
            x.imageSmoothingQuality = 'high'; x.drawImage(photoImg, (iw - sw) / 2, (ih - sh) / 2.4, sw, sh, 0, 0, s.width, s.height);
            const d = x.getImageData(0, 0, s.width, s.height).data, L = [];
            for (let i = 0; i < d.length; i += 4)L.push((.3 * d[i] + .59 * d[i + 1] + .11 * d[i + 2]) / 255);
            const so = [...L].sort((a, b) => a - b), lo = so[Math.floor(L.length * .05)], hi = so[Math.floor(L.length * .97)];
            const T = []; const gw = s.width, gh = s.height;
            for (let j = 0; j < gh; j++)for (let i = 0; i < gw; i++) { const l = Math.pow(Math.max(0, Math.min(1, (L[j * gw + i] - lo) / (hi - lo || 1))), 1.3); if (l > (CFG.colorHearts ? .05 : .16)) { const o = (j * gw + i) * 4; T.push([(i + .5) / gw, (j + .5) / gh, l, ((d[o] >> 5) << 6) | ((d[o + 1] >> 5) << 3) | (d[o + 2] >> 5)]) } }
            N = T.length; P = { nx: new Float32Array(N), ny: new Float32Array(N), l: new Float32Array(N), r: new Float32Array(N), th: new Float32Array(N), dl: new Float32Array(N), gc: new Uint8Array(N), c: new Uint16Array(N) };
            const R = Math.min(W, H) * .46;
            T.sort(() => Math.random() - .5).forEach((t, i) => {
                P.nx[i] = t[0]; P.ny[i] = t[1]; P.l[i] = t[2]; P.c[i] = t[3];
                const r = Math.pow(Math.random(), .65) * R; P.r[i] = r; P.th[i] = (i % 3) * 2.094 + r / R * 5 + (Math.random() - .5) * (.5 + r / R * .3); P.dl[i] = Math.random(); P.gc[i] = Math.min(15, Math.floor((1 - r / R) * 10 + Math.random() * 6))
            })
        }
        const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        let last = 0;

        function frame(ms) {
            const t = ms / 1000, dt = Math.min(.05, t - last); last = t;
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
            for (const s of stars) { ctx.globalAlpha = .35 + .5 * Math.sin(t * 1.5 + s.p) ** 2; ctx.fillStyle = '#fff'; ctx.fillRect(s.x * W, s.y * H, s.r, s.r) }
            if (P && (stage === 'galaxy' || stage === 'form' || stage === 'done')) {
                ph += dt * (.25 + spin); spin *= .96;
                const cx = W / 2, cy = H * .42, R = Math.min(W, H) * .46, fh = Math.min(H * .66, W * 1.3), fw = fh * COLS / ROWS, fx = cx - fw / 2, fy = H * .05;
                const appear = stage === 'galaxy' ? Math.min(1, (t - gT) / 2) : 1;
                const tp = stage === 'galaxy' ? 0 : Math.min(1, (t - tStart) / 5.5);
                if (tp >= 1 && stage === 'form') finish();
                const cell = fw / Math.round(COLS * 3.5);
                for (let i = 0; i < N; i++) {
                    const r = P.r[i], a = P.th[i] + ph / (.35 + r / R * .9);
                    let gx = Math.cos(a) * r, gy = Math.sin(a) * r * .82;
                    const e = ease(Math.max(0, Math.min(1, (tp - P.dl[i] * .4) / .6)));
                    let x = cx + gx, y = cy + gy, sz = 4 + (1 - r / R) * 3, spr = galSp[P.gc[i]];
                    if (e > 0) {
                        const k = (1 - e) * 2.2, c = Math.cos(k), s = Math.sin(k), rx = gx * c - gy * s, ry = gx * s + gy * c;
                        const tx = fx + P.nx[i] * fw, ty = fy + P.ny[i] * fh; x = cx + rx + (tx - cx - rx) * e; y = cy + ry + (ty - cy - ry) * e;
                        sz = sz + (cell * (CFG.colorHearts ? 2.1 : 2.6) * (.8 + .3 * P.l[i]) * (1 + .05 * Math.sin(t * 2 + i)) - sz) * e; if (e > .5) spr = CFG.colorHearts ? cs(P.c[i]) : faceSp[Math.min(15, Math.floor(P.l[i] * 16))]
                    }
                    ctx.globalAlpha = appear * (e > 0 ? 1 : .55 + .45 * Math.sin(t * 2 + i) ** 2);
                    ctx.drawImage(spr, x - sz / 2, y - sz / 2, sz, sz)
                }
                ctx.globalAlpha = 1
            }
            requestAnimationFrame(frame)
        }
        let gT = 0;
        function typeText() {
            const el = $('#txt'), full = CFG.letter.join('\n\n'); let i = 0;
            (function s() { el.innerHTML = full.slice(0, i).replace(/</g, '&lt;') + '<i></i>'; if (i++ < full.length) setTimeout(s, full[i - 1] === '\n' ? 250 : 42); else { el.querySelector('i').remove(); $('#b1').classList.remove('hide') } })()
        }
        $('#env').onclick = () => {
            if (stage !== 'start') return; stage = 'open'; $('#hint').classList.add('hide'); $('#title').classList.add('hide'); $('#env').classList.add('open');
            setTimeout(() => $('#letter').classList.add('rise'), 900);
            setTimeout(() => { $('#env').classList.add('gone'); $('#letter').classList.add('full'); typeText() }, 2100)
        };
        $('#b1').onclick = () => {
            $('#b1').classList.add('hide'); $('#letter').classList.add('out'); stage = 'galaxy'; gT = performance.now() / 1000;
            setTimeout(() => { $('#g').classList.remove('hide'); $('#b2').classList.remove('hide') }, 1800)
        };
        $('#b2').onclick = () => { $('#b2').classList.add('hide'); $('#g').classList.add('hide'); stage = 'form'; tStart = performance.now() / 1000; spin = 2 };
        function finish() { stage = 'done'; const f = $('#final'); f.innerHTML = CFG.name + '<small>' + CFG.finalText + '</small>'; f.classList.remove('hide') }
        let px = null;
        addEventListener('pointerdown', e => px = e.clientX); addEventListener('pointerup', () => px = null);
        addEventListener('pointermove', e => { if (px !== null && stage === 'galaxy') { spin += (e.clientX - px) * .03; px = e.clientX } });
        addEventListener('resize', () => photoImg && build());
        $('#file').onchange = e => { const f = e.target.files[0]; if (f) loadPhoto(URL.createObjectURL(f)) };
        loadPhoto(CFG.photo); requestAnimationFrame(frame);
    </script>
</body>

</html>
